<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Our Chat ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         LOGIN SCREEN
    ========================== -->

    <div id="loginScreen" class="login-screen">

        <div class="login-box">

            <div class="heart">❤️</div>

            <h1>Our Chat</h1>

            <p>Just you and me.</p>

            <input
                type="text"
                id="nameInput"
                placeholder="Enter your name"
                autocomplete="off"
            >

            <button id="loginBtn">
                Enter Chat
            </button>

        </div>

    </div>


    <!-- =========================
         CHAT APP
    ========================== -->

    <div id="chatApp" class="chat-app hidden">

        <!-- HEADER -->

        <header class="chat-header">

            <div class="profile">

                <div class="avatar">
                    ❤️
                </div>

                <div>
                    <h2>Our Chat</h2>

                    <span id="onlineStatus">
                        Online
                    </span>
                </div>

            </div>

            <button
                id="logoutBtn"
                class="logout-btn"
            >
                Logout
            </button>

        </header>


        <!-- MESSAGES -->

        <main
            id="messages"
            class="messages"
        >

            <div class="welcome-message">
                <div>❤️</div>
                <p>Start our conversation...</p>
            </div>

        </main>


        <!-- MESSAGE INPUT -->

        <form
            id="messageForm"
            class="message-form"
        >

            <input
                type="text"
                id="messageInput"
                placeholder="Type a message..."
                autocomplete="off"
                maxlength="1000"
            >

            <button
                type="submit"
                id="sendBtn"
            >
                ➤
            </button>

        </form>

    </div>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <script src="chat.js"></script>

</body>

</html>
