<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Reem ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;
    color: white;

    background:
        radial-gradient(circle at 20% 20%, #ffb3c6 0%, transparent 30%),
        radial-gradient(circle at 80% 80%, #9b5de5 0%, transparent 30%),
        linear-gradient(135deg, #ff416c, #7b2cbf);
}

/* =========================
   BACKGROUND GLOW
========================= */

.glow {
    position: fixed;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    filter: blur(80px);
    opacity: .35;

    animation: moveGlow 8s infinite alternate ease-in-out;

    pointer-events: none;
}

.glow.one {
    background: #ff1744;
    top: -100px;
    left: -100px;
}

.glow.two {
    background: #e040fb;
    bottom: -100px;
    right: -100px;

    animation-delay: 2s;
}

@keyframes moveGlow {
    from {
        transform: translate(0, 0) scale(1);
    }

    to {
        transform: translate(80px, 60px) scale(1.3);
    }
}


/* =========================
   FLOATING HEARTS
========================= */

.heart {
    position: fixed;
    bottom: -50px;

    pointer-events: none;

    opacity: 0;

    z-index: 1;

    animation: floatUp linear forwards;
}

@keyframes floatUp {

    0% {
        transform:
            translateY(0)
            rotate(0deg);

        opacity: 0;
    }

    15% {
        opacity: .8;
    }

    100% {
        transform:
            translateY(-110vh)
            rotate(360deg);

        opacity: 0;
    }
}


/* =========================
   CARD
========================= */

.card {
    position: relative;

    z-index: 5;

    width: min(90%, 440px);

    padding: 45px 28px;

    text-align: center;

    background: rgba(255,255,255,.15);

    border:
        1px solid
        rgba(255,255,255,.3);

    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    border-radius: 30px;

    box-shadow:
        0 30px 80px rgba(0,0,0,.25);

    animation:
        cardIn 1.2s
        cubic-bezier(.2,.8,.2,1);
}

@keyframes cardIn {

    from {
        opacity: 0;
        transform:
            translateY(50px)
            scale(.9);
    }

    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================
   MAIN HEART
========================= */

.main-heart {
    font-size: 75px;

    margin-bottom: 15px;

    animation:
        heartbeat 1.3s infinite,
        glowHeart 2s infinite alternate;
}

@keyframes heartbeat {

    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.15);
    }
}

@keyframes glowHeart {

    from {
        filter:
            drop-shadow(
                0 0 5px
                rgba(255,255,255,.5)
            );
    }

    to {
        filter:
            drop-shadow(
                0 0 25px
                rgba(255,255,255,.9)
            );
    }
}


/* =========================
   TEXT
========================= */

.small {
    font-size: 14px;

    letter-spacing: 2px;

    text-transform: uppercase;

    opacity: .85;

    margin-bottom: 10px;
}

h1 {
    font-size:
        clamp(30px, 8vw, 44px);

    margin-bottom: 15px;
}

.message {
    font-size: 17px;

    line-height: 1.7;

    opacity: .95;

    margin-bottom: 30px;
}


/* =========================
   BUTTONS
========================= */

.buttons {

    display: flex;

    justify-content: center;

    gap: 14px;
}

button {

    border: none;

    border-radius: 50px;

    padding:
        15px 30px;

    font-size: 17px;

    font-weight: 700;

    cursor: pointer;

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        background .25s ease;
}

button:hover {

    transform:
        translateY(-5px)
        scale(1.04);
}

button:active {

    transform:
        scale(.94);
}


/* YES */

#yesBtn {

    background: white;

    color: #ff416c;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.2);
}


/* NO */

#noBtn {

    color: white;

    background:
        rgba(255,255,255,.15);

    border:
        1px solid
        rgba(255,255,255,.5);
}


/* =========================
   MUSIC BUTTON
========================= */

.music {

    position: fixed;

    z-index: 20;

    top: 20px;
    right: 20px;

    width: 48px;
    height: 48px;

    padding: 0;

    border-radius: 50%;

    background:
        rgba(255,255,255,.2);

    color: white;

    backdrop-filter:
        blur(10px);

    border:
        1px solid
        rgba(255,255,255,.3);
}


/* =========================
   SUCCESS SCREEN
========================= */

.success {

    display: none;
}

.success-heart {

    font-size: 100px;

    animation:
        successBeat 1s infinite;
}

@keyframes successBeat {

    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.2);
    }
}

.success h1 {

    margin-top: 10px;
}

.signature {

    margin-top: 25px;

    font-size: 18px;

    font-style: italic;
}


/* =========================
   MOBILE
========================= */

@media(max-width:500px) {

    .card {

        padding:
            38px 22px;
    }

    .buttons {

        flex-direction: column;
    }

    button {

        width: 100%;
    }
}
</style>
</head>


<body>


<!-- =========================
     BACKGROUND
========================= -->

<div class="glow one"></div>
<div class="glow two"></div>


<!-- =========================
     MUSIC
========================= -->

<audio id="music" loop>

    <source
        src="song.mp3"
        type="audio/mpeg">

</audio>


<button
    class="music"
    id="musicBtn">

    🎵

</button>



<!-- =========================
     QUESTION CARD
========================= -->

<div
    class="card"
    id="questionCard">


    <div class="main-heart">
        ❤️
    </div>


    <div class="small">
        A little question for you
    </div>


    <h1>
        മുത്തേ 
    </h1>


    <p class="message">

        Shemik kutta. 🥺

        <br><br>

        really sorry...

        <br><br>

        <b>
            Pleaseeee shemikkk
        </b>

    </p>


    <div class="buttons">


        <button id="yesBtn">

            Yes ❤️

        </button>


        <button id="noBtn">

            No 😤

        </button>


    </div>

</div>



<!-- =========================
     SUCCESS CARD
========================= -->

<div
    class="card success"
    id="successCard">


    <div class="success-heart">

        ❤️

    </div>


    <div class="small">

        Thanks mwthwe..  Ini orikkalum njn anagne cheyilla

    </div>


    <h1>

        Ummwaahh💋

    </h1>


    <p class="message">

        Love You
❤️

        <br><br>

        I'm really sorry.

        <br><br>

        ummmaaaa

        <br><br>

        love u💋

    </p>


    <div class="signature">

        — With love, Ikru ❤️

    </div>

</div>



<script>

/* =========================
   GET ELEMENTS
========================= */

const yesBtn =
    document.getElementById("yesBtn");

const noBtn =
    document.getElementById("noBtn");

const questionCard =
    document.getElementById("questionCard");

const successCard =
    document.getElementById("successCard");

const music =
    document.getElementById("music");

const musicBtn =
    document.getElementById("musicBtn");


let musicPlaying = false;


/* =========================
   MUSIC
========================= */

function startMusic() {

    music.play()
        .then(() => {

            musicPlaying = true;

            musicBtn.textContent = "🔊";

        })
        .catch(() => {

            /*
            Browser blocked autoplay.
            User can press the music button.
            */

        });
}


/* Music button */

musicBtn.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        if (musicPlaying) {

            music.pause();

            musicPlaying = false;

            musicBtn.textContent = "🎵";

        }

        else {

            music.play()
                .then(() => {

                    musicPlaying = true;

                    musicBtn.textContent = "🔊";

                })
                .catch(() => {});

        }

    }
);


/* =========================
   YES BUTTON
========================= */

yesBtn.addEventListener(
    "click",
    function() {

        forgive();

    }
);


/* =========================
   NO BUTTON
========================= */

noBtn.addEventListener(
    "click",
    function() {

        /*
        Change NO into YES
        */

        noBtn.textContent =
            "Yes ❤️";


        /*
        Change appearance
        */

        noBtn.style.background =
            "white";

        noBtn.style.color =
            "#ff416c";

        noBtn.style.border =
            "none";

        noBtn.style.boxShadow =
            "0 10px 30px rgba(0,0,0,.2)";


        /*
        IMPORTANT:
        Remove the old click behavior
        and make this button a YES button.
        */

        noBtn.onclick =
            function() {

                forgive();

            };


        /*
        Little heart celebration
        */

        createHearts(15);


        /*
        Start music
        */

        startMusic();

    }
);


/* =========================
   FORGIVE
========================= */

function forgive() {

    questionCard.style.display =
        "none";


    successCard.style.display =
        "block";


    /*
    Start music
    */

    startMusic();


    /*
    Big heart celebration
    */

    createHearts(60);

}


/* =========================
   HEART TYPES
========================= */

const heartTypes = [

    "❤️",
    "💕",
    "💗",
    "💖",
    "💘",
    "💝"

];


/* =========================
   CREATE ONE HEART
========================= */

function createHeart() {

    const heart =
        document.createElement("div");


    heart.className =
        "heart";


    heart.textContent =
        heartTypes[
            Math.floor(
                Math.random()
                *
                heartTypes.length
            )
        ];


    heart.style.left =
        Math.random() * 100 + "vw";


    heart.style.fontSize =
        (
            15
            +
            Math.random() * 25
        )
        +
        "px";


    heart.style.animationDuration =
        (
            5
            +
            Math.random() * 6
        )
        +
        "s";


    document.body.appendChild(
        heart
    );


    setTimeout(
        function() {

            heart.remove();

        },
        12000
    );

}


/* =========================
   BACKGROUND HEARTS
========================= */

setInterval(
    createHeart,
    700
);


/* =========================
   HEART CELEBRATION
========================= */

function createHearts(amount) {

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        setTimeout(
            function() {

                createHeart();

            },
            i * 50
        );

    }

}


/* =========================
   START SOME HEARTS
========================= */

for (
    let i = 0;
    i < 5;
    i++
) {

    setTimeout(
        createHeart,
        i * 500
    );

}

</script>

</body>
</html>
